# Los proyectos gratuitos de Supabase se PAUSAN tras 1 semana sin actividad
# (https://supabase.com/pricing). Esto les da un toque cada 3 días para que la
# app de Amigos esté siempre lista, aunque nadie la abra en unos días.
#
# Para activarlo: en GitHub → Settings → Secrets and variables → Actions,
# crea SUPABASE_URL (https://xxxx.supabase.co) y SUPABASE_ANON_KEY.
# Sin esos secretos el job no hace nada y no falla.
name: Mantener Supabase despierto

on:
  schedule:
    - cron: '17 6 */3 * *' # cada 3 días
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Latido a la base de datos
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Sin SUPABASE_URL / SUPABASE_ANON_KEY: nada que hacer todavía."
            exit 0
          fi
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            "${URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code -> $(cat /tmp/out)"
          case "$code" in
            2*) echo "Base despierta." ;;
            *)  echo "La base no respondió como se esperaba."; exit 1 ;;
          esac
